<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Gorjetas</title>
  <link rel="stylesheet" href="style.css">
  <title>Calculador de Gorjetas</title>
</head>

<body>
  <div class="container">
    <h1>Calculadora de Gorjetas</h1>

    <div class="form-group">
      <label for="valor-conta">Valor da Conta (R$)</label>
      <input type="number" id="valor-conta" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
      <label for="qualidade-servico">Qualidade do Serviço</label>
      <select id="qualidade-servico">
        <option value="" disabled selected>Escolha uma opção</option>
        <option value="0.10">10% - Serviço OK</option>
        <option value="0.15">15% - Serviço Bom</option>
        <option value="0.20">20% - Serviço Excelente</option>
      </select>
    </div>

    <div class="form-group">
      <label for="num-pessoas">Número de Pessoas</label>
      <input type="number" id="num-pessoas" placeholder="1" min="1" value="1">
    </div>

    <button id="calcular-btn">Calcular</button>

    <div id="resultado" class="resultado escondido">
      <h2>Resultado</h2>
      <p>Gorjeta Total: <span id="gorjeta-total">R$ 0,00</span></p>
      <p>Total da Conta: <span id="total-conta">R$ 0,00</span></p>
      <p>Valor por Pessoa: <span id="valor-pessoa">R$ 0,00</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
